<!doctype html>
<html lang="zh-CN" class="theme-light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M HUB</title>
<link rel="stylesheet" href="./splash.css">
<script>
  /* 主题必须在首帧之前定下来，避免洗白时闪一下默认配色 */
  (function () {
    var dark = /(?:^|[?&])theme=dark(?:&|$)/.test(location.search);
    var root = document.documentElement;
    root.classList.remove('theme-light', 'theme-dark');
    root.classList.add(dark ? 'theme-dark' : 'theme-light');
    /* 主进程可能在 splash.js 还没执行时就调用：先排队，运行时就绪后接管 */
    var queue = [];
    window.__startupDismissQueue = queue;
    window.dismissStartup = function (fadeMs) {
      return new Promise(function (resolve) { queue.push({ fadeMs: fadeMs, resolve: resolve }); });
    };
  })();
</script>
<script src="./splash.js" defer></script>
<script>
  setTimeout(function () {
    if (window.__mhubForceDone) window.__mhubForceDone();
  }, 28000);
</script>
</head>
<body>
<div class="dsu-root" id="startup-root">

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="kmark" viewBox="0 0 745 576">
      <path d="M275 0 L260 10 L2 270 L0 430 L5 436 L12 438 L13 438 L21 434 L435 20 L438 8 L431 0 Z" />

    </symbol>
  </svg>

  <div class="dsu-plate" id="plate"></div>
  <div class="dsu-vignette" id="vignette"></div>
  <div class="dsu-watermark" id="watermark">
    <span class="dsu-wm" style="left:60%;top:2%;width:16%;height:96%"></span>
    <span class="dsu-wm" style="left:78%;top:2%;width:16%;height:96%"></span>
    <span class="dsu-wm" style="left:96%;top:2%;width:16%;height:96%"></span>
    <span class="dsu-wm" style="left:5%;top:2%;width:10%;height:50%"></span>
  </div>
  <div class="dsu-grain"></div>

    <path class="dsu-ring-b" d="M407 485.3 A214 214 0 1 0 193 485.3" />
    <path class="dsu-bracket" d="M300 8 L300 -8 M300 592 L300 608 M8 300 L-8 300 M592 300 L608 300" />
    <g class="dsu-ret-rot-a">
      <path class="dsu-ring-thin" d="M109 109 L134 134 M466 466 L491 491 M491 109 L466 134 M134 466 L109 491" />
    </g>
    <g class="dsu-ret-rot-b">
      <circle class="dsu-ring-thin" cx="300" cy="300" r="150" stroke-dasharray="2 9" />
    </g>
    <path class="dsu-ring-thin" d="M300 30 L300 66 M300 534 L300 570 M30 300 L66 300 M534 300 L570 300" />
    <circle class="dsu-dot-o" cx="300" cy="300" r="4.5" />
    <circle class="dsu-dot-a" cx="300" cy="28" r="3.4" />
    <circle class="dsu-dot-b" cx="300" cy="572" r="2.6" />
  </svg>

  <header class="dsu-brand" id="brand">
    <div class="dsu-brand-1">M HUB</div>
    <div class="dsu-brand-2">MCHOSE PRECISION PERIPHERALS</div>
    <div class="dsu-brand-3"><b>CONTROL</b><span>HUB</span></div>

  <div class="dsu-meta" id="meta">

  </div>
  <div class="dsu-slats" id="slats">

    <i class="dsu-slat"></i><i class="dsu-slat"></i><i class="dsu-slat"></i>
  </div>

  <div class="dsu-center" id="center">
    <div class="dsu-status" id="status">
      <span class="dsu-status-zh" id="statusZh"></span>

    </div>
    <div class="dsu-sub-en" id="subEn"></div>
    <div class="dsu-rule" id="rule"></div>
    <div class="dsu-logo" id="logo">
      <svg viewBox="0 0 745 576" aria-hidden="true">
        <path class="dsu-kpath" d="M275 0 L260 10 L2 270 L0 430 L5 436 L12 438 L13 438 L21 434 L435 20 L438 8 L431 0 Z" />
        <path class="dsu-kpath" d="M582 0 L568 9 L302 275 L298 284 L298 293 L303 303 L572 571 L581 576 L737 576 L744 569 L743 559 L531 348 L474 290 L474 286 L744 16 L745 8 L737 0 Z" />
        <path class="dsu-kpath" d="M227 358 L214 363 L18 559 L16 568 L23 576 L180 576 L188 572 L304 456 L310 442 L306 427 L244 364 L230 358 Z" />
      </svg>

    </div>

  <div class="dsu-idline" id="idline">· ID CONFIRMED : MCHOSE-01</div>
  <div class="dsu-hex" id="hex"></div>
  <div class="dsu-voice" id="voice"><i></i><i></i><i></i><i></i><i></i></div>

  <div class="dsu-action" id="action">
    <button class="dsu-btn" id="btn" type="button">
      <span class="dsu-btn-zh" id="btnZh"></span>
      <span class="dsu-btn-en" id="btnEn"></span>
    </button>
    <div class="dsu-hint" id="hint"></div>
    <div class="dsu-card" id="card" hidden></div>
  </div>

  <div class="dsu-welcome" id="welcome">
    <div class="dsu-w1" id="w1">欢迎访问</div>
    <div class="dsu-w2" id="w2">M HUB</div>
    <div class="dsu-w3" id="w3">
      <svg viewBox="0 0 745 576" aria-hidden="true"><use href="#kmark"></use></svg>
      <span>MCHOSE CONTROL CENTER</span>
    </div>
    <div class="dsu-w4" id="w4">设备控制已就绪</div>
  </div>

  <div class="dsu-stepcount" id="stepcount">[ 00 / 06 ] INIT</div>
  <div class="dsu-foot" id="foot"><span>POWERED BY MCHOSE</span><i></i></div>
  <div class="dsu-subtitle">
    <div class="dsu-sub-zh" id="subZh"></div>
    <div class="dsu-sub-en2" id="subEn2"></div>
  </div>
  <div class="dsu-progress" id="progress"><i id="progressBar"></i></div>

  <button class="dsu-skip" id="skip" type="button" hidden>SKIP ›</button>

  <div class="dsu-frame" id="frame">
    <i class="dsu-corner dsu-c-tl"></i>
    <i class="dsu-corner dsu-c-tr"></i>
    <i class="dsu-corner dsu-c-bl"></i>
    <i class="dsu-corner dsu-c-br"></i>

  </div>

  <div class="dsu-black" id="black">
    <div class="dsu-black-inner" id="blackInner">
      <svg class="dsu-whale" viewBox="0 0 745 576" aria-hidden="true"><use href="#kmark"></use></svg>
      <div class="dsu-black-zh">M HUB</div>
      <div class="dsu-black-en" id="blackEn">MCHOSE</div>
      <div class="dsu-black-sub">PRECISION PERIPHERALS · CONTROL CENTER</div>
    </div>
    <div class="dsu-sweep" id="sweep"></div>
  </div>

  <div class="dsu-wash" id="wash"></div>
  <div class="dsu-bloom" id="bloom"></div>
  <div class="dsu-streak" id="streak"></div>
  <div class="dsu-flash" id="flash"></div>

  <div class="dsu-audiobank" id="audioBank" aria-hidden="true"></div>
</div>
</body>
</html>
